<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<title>Cancionero</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="home">
  <h1>Cancionero</h1>
  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="Canción o artista…" enterkeyhint="search" required>
    <button type="submit">Buscar</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="results" class="list"></ul>
  <h2 id="recentsTitle" hidden>Recientes</h2>
  <ul id="recents" class="list"></ul>
</main>

<section id="player" hidden>
  <header>
    <button id="back" aria-label="Volver">←</button>
    <div><strong id="songTitle"></strong><small id="songSource"></small></div>
    <div class="fontbtns">
      <button id="fontDown" aria-label="Letra más chica">A−</button>
      <button id="fontUp" aria-label="Letra más grande">A+</button>
    </div>
  </header>
  <article id="song"></article>
  <div class="spacer"></div>
  <nav id="controls">
    <button id="slower" aria-label="Más lento">−</button>
    <button id="play" aria-label="Reproducir">▶</button>
    <button id="faster" aria-label="Más rápido">+</button>
    <span id="speedLabel"></span>
  </nav>
</section>
<script src="/app.js" type="module"></script>
</body>
</html>
